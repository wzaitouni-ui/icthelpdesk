        :root[data-theme="studio"] .account-menu a.danger { color: #ffb9c2; }
        :root[data-theme="studio"] .laptop-screen {
            background: radial-gradient(130% 100% at 50% 0%, #16213a 0%, #05070b 72%);
            border-color: #202737;
            box-shadow: 0 0 46px rgba(140,180,240,.20), inset 0 0 44px rgba(140,180,240,.09);
        }

        /* ---------- De kamer beweegt ----------
           Alles hier is een opacity- of transform-animatie: geen filters op
           grote vlakken, dus de scene kost de browser vrijwel niets. */
        .bg-studio { animation: st-breathe 34s ease-in-out infinite alternate; }
        @keyframes st-breathe {
            from { transform: scale(1.02) translate3d(-.4%, .2%, 0); }
            to   { transform: scale(1.06) translate3d(.4%, -.3%, 0); }
        }
        /* Stadslichten: vier ritmes door elkaar, zodat er geen patroon in zit. */
        .bg-studio .tw { animation: st-twinkle 5s ease-in-out infinite alternate; }
        .bg-studio .tw.b { animation-duration: 7s; animation-delay: -2s; }
        .bg-studio .tw.c { animation-duration: 9s; animation-delay: -5s; }
        .bg-studio .tw.d { animation-duration: 6.5s; animation-delay: -3.5s; }
        @keyframes st-twinkle { from { opacity: .35; } to { opacity: 1; } }
        /* Het scherm ademt licht, zoals een echt scherm dat aanstaat. */
        .bg-studio .st-screen { animation: st-glow 7s ease-in-out infinite alternate; }
        @keyframes st-glow { from { opacity: .82; } to { opacity: 1; } }
        /* Knipperende cursor in de tekst op het scherm. */
        .bg-studio .st-caret { animation: st-blink 1.15s steps(1, end) infinite; }
        @keyframes st-blink { 0%, 50% { opacity: .55; } 51%, 100% { opacity: 0; } }
        /* Stoom: stijgt op en lost op, elk sliertje net iets anders.
           Alleen verschuiven en vervagen, geen schaal: schalen in een SVG gaat
           om een oorsprong die per element anders ligt, en dan glijdt het
           sliertje zijwaarts weg in plaats van recht omhoog te stijgen. */
        .bg-studio .st-steam path { opacity: 0; animation: st-steam 6s ease-in-out infinite; }
        .bg-studio .st-steam .s2 { animation-delay: -2s; }
        .bg-studio .st-steam .s3 { animation-delay: -4s; }
        @keyframes st-steam {
            0%   { opacity: 0; transform: translateY(8px); }
            30%  { opacity: .34; }
            100% { opacity: 0; transform: translateY(-48px); }
        }
        /* transform-box en beide keyframes staan er expliciet bij: zonder dat
           zou de browser moeten mengen tussen een SVG-transformatieattribuut en
           een CSS-transform, en dat loopt niet vloeiend. */
        .bg-studio .st-sweep {
            transform-box: view-box; transform-origin: 800px 450px;
            animation: st-sweep 26s linear infinite;
        }
        @keyframes st-sweep {
            from { transform: rotate(14deg) translateX(0); }
            to   { transform: rotate(14deg) translateX(2900px); }
        }
        .bg-studio .st-motes circle { animation: st-mote 13s ease-in-out infinite alternate; }
        .bg-studio .st-motes .m2 { animation-duration: 17s; animation-delay: -6s; }
        .bg-studio .st-motes .m3 { animation-duration: 21s; animation-delay: -11s; }
        @keyframes st-mote {
            from { transform: translate3d(0, 0, 0); opacity: .18; }
            to   { transform: translate3d(-26px, -40px, 0); opacity: .6; }
        }
        @media (prefers-reduced-motion: reduce) {
            .bg-studio, .bg-studio * { animation: none; }
        }

        /* ---------- De entree in studio ----------
           Elders komt inhoud zacht omhoog; hier springt hij het scherm in.
           Dat zit hem in de cubic-bezier: de derde waarde boven 1 laat de
           beweging voorbij het eindpunt schieten en terugveren. Vandaar dat
           de schaal ook kleiner begint -- zonder dat verschil valt er niets
           te veren. */
        :root[data-theme="studio"].js-reveal .hero > *,
        :root[data-theme="studio"].js-reveal .card,
        :root[data-theme="studio"].js-reveal .section,
        :root[data-theme="studio"].js-reveal .laptop-block,
        :root[data-theme="studio"].js-reveal .login-card {
            transform: translateY(44px) scale(.88);
            transition: opacity .42s cubic-bezier(.2,.7,.3,1),
                        transform .78s cubic-bezier(.34,1.56,.64,1);
        }

        @media (max-width: 640px) {
            .topbar { padding: 12px 16px; }
            .page { padding: 32px 16px 72px; }
            .card { padding: 24px; }
            .code-panel { padding: 22px; }
            .login-card { padding: 32px 22px; min-height: min(80vh, 560px); }
            .account-name { display: none; }
            .account-btn { padding: 5px; }
            .nav-home-label { display: none; }
            .nav-home { padding: 10px; }
        }
    
    </style>
    <style>

        <svg class="bg-studio" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

    <script>
        {% verbatim %}        /* Vier standen in het menu: licht, donker, neon en studio. Welke regel
           het vinkje krijgt regelt de CSS uit data-theme; JS houdt alleen
           aria-pressed bij, want dat kan CSS niet. */
        var THEMES = ['neon', 'studio'];

        function syncThemeMenu() {
            var cur = document.documentElement.getAttribute('data-theme');
            if (THEMES.indexOf(cur) === -1) { cur = 'studio'; }
            var items = document.querySelectorAll('.theme-menu [data-set]');
            for (var i = 0; i < items.length; i++) {
                items[i].setAttribute('aria-pressed', items[i].getAttribute('data-set') === cur ? 'true' : 'false');
            }
        }

        function setTheme(mode) {
            var root = document.documentElement;
            try { localStorage.setItem('theme', mode); }
            catch (e) { /* localStorage kan geblokkeerd zijn */ }
            root.setAttribute('data-theme', mode);
            syncThemeMenu();
            // Studio heeft een eigen entree; die spelen we meteen af, zodat je
            // bij het kiezen ziet waar de stand voor staat.
            if (mode === 'studio') { replayReveal(); }
            // Het menu staat open zolang er focus in zit; focus weghalen sluit
            // het dus na een keuze, net zoals wegbewegen met de muis dat doet.
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }
        }

        syncThemeMenu();

        /* De entree opnieuw afspelen: alles wat al binnen is gaat er even uit
           en komt na elkaar weer terug. Gebruikt bij het kiezen van studio.

           De void-regel is geen opvulling: zonder het uitlezen van een maat
           verwerkt de browser het weghalen en terugzetten van de klasse in een
           keer, ziet hij alleen de eindtoestand, en speelt de overgang niet af.
           Dat uitlezen dwingt hem de tussenstand echt te verwerken. */
        function replayReveal() {
            var els = document.querySelectorAll('.is-in');
            if (!els.length) { return; }
            for (var i = 0; i < els.length; i++) { els[i].classList.remove('is-in'); }
            void document.body.offsetWidth;
            for (var i = 0; i < els.length; i++) {
                (function (el, n) {
                    setTimeout(function () { el.classList.add('is-in'); }, n * 70);
                })(els[i], i);
            }
        }

        /* Inhoud laten binnenkomen bij het scrollen. De <head> heeft alles al
           verborgen; hier wordt het weer zichtbaar zodra het in beeld schuift.
           Elk element wordt na de eerste keer losgelaten, want dit is een
           binnenkomst en geen effect dat bij elke scroll opnieuw moet spelen.
           Gaat er onverhoopt iets mis, dan valt de vlag weg en staat alles er
           gewoon: liever geen animatie dan onzichtbare inhoud. */
        (function () {
            var root = document.documentElement;
            if (root.className.indexOf('js-reveal') === -1) { return; }
            try {
                var els = document.querySelectorAll(
                    '.hero > *, .card, .section, .laptop-block, .login-card');
                var io = new IntersectionObserver(function (entries) {
                    for (var i = 0; i < entries.length; i++) {
                        if (entries[i].isIntersecting) {
                            entries[i].target.classList.add('is-in');
                            io.unobserve(entries[i].target);
                        }
                    }
                }, { rootMargin: '0px 0px -6% 0px', threshold: .05 });
                for (var i = 0; i < els.length; i++) { io.observe(els[i]); }
            } catch (e) {
                root.className = root.className.replace(' js-reveal', '');
            }
        })();
            {% endverbatim %}
    </script>

    <script>
        // Alle state bovenaan, zodat niets wordt gebruikt voordat het bestaat.
        const INTAKE = JSON.parse(document.getElementById('intake').textContent);
        const CATEGORIE_LABEL = Object.fromEntries(INTAKE.categorieen);
        const PRIORITEIT_LABEL = { kritiek: 'Kritiek', hoog: 'Hoog', normaal: 'Normaal', laag: 'Laag' };
        const CSRF = document.querySelector('meta[name="csrf-token"]').content;
        const berichten = document.getElementById('berichten');
        const tekstVeld = document.getElementById('tekst');
        const verstuurKnop = document.getElementById('verstuur');
        let melding;          // wat we tot nu toe weten
        let wachtOp = null;   // welke getypte invoer we verwachten: 'onderwerp', 'omschrijving' of 'naam'
        let openOpties = null;

        function nieuweMelding() {
            return { categorie: null, vraagIndex: 0, antwoorden: [], prioriteit: null, omschrijving: null, naam: null };
        }

        function bericht(tekst, wie) {
            const el = document.createElement('div');
            el.className = 'bericht ' + wie;
            el.textContent = tekst;
            berichten.appendChild(el);
            berichten.scrollTop = berichten.scrollHeight;
        }

        function opties(lijst, bijKeuze) {
            const groep = document.createElement('div');
            groep.className = 'opties';
            lijst.forEach(optie => {
                const knop = document.createElement('button');
                knop.type = 'button';
                knop.className = optie.hoofd ? 'btn' : 'btn-ghost';
                knop.textContent = optie.label;
                knop.addEventListener('click', () => {
                    sluitOpties();
                    knop.classList.add('gekozen');
                    bericht(optie.label, 'gebruiker');
                    bijKeuze(optie);
                });
                groep.appendChild(knop);
            });
            berichten.appendChild(groep);
            berichten.scrollTop = berichten.scrollHeight;
            openOpties = groep;
        }

        function sluitOpties() {
            if (openOpties) openOpties.querySelectorAll('button').forEach(b => b.disabled = true);
            openOpties = null;
        }

        function verwachtTekst(soort, placeholder) {
            wachtOp = soort;
            tekstVeld.disabled = verstuurKnop.disabled = !soort;
            tekstVeld.placeholder = placeholder || 'Kies hierboven een antwoord';
            if (soort) tekstVeld.focus({ preventScroll: true });
        }

        function bewaard() { try { return localStorage.getItem('hd-naam') || ''; } catch (e) { return ''; } }
        function bewaar(naam) { try { localStorage.setItem('hd-naam', naam); } catch (e) {} }

        // Bepaalt steeds de volgende vraag op basis van wat we al weten.
        function volgende() {
            const m = melding;
            const vragen = INTAKE.vragen[m.categorie] || [];

            if (!m.categorie) {
                bericht('Hoi! Ik zet je melding direct door naar de ICT-beheerder. Waar gaat het over? Kies een onderwerp of typ het kort.', 'bot');
                opties(INTAKE.categorieen.map(([code, label]) => ({ label, code })), o => { m.categorie = o.code; volgende(); });
                verwachtTekst('onderwerp', "Of typ het kort, bijv. 'printer doet niks'");
            } else if (m.vraagIndex < vragen.length) {
                const v = vragen[m.vraagIndex];
                bericht(v.vraag, 'bot');
                opties(v.opties, o => {
                    m.antwoorden.push(v.vraag + ' ' + o.label);
                    if (o.prioriteit) m.prioriteit = o.prioriteit;
                    m.vraagIndex++;
                    volgende();
                });
                verwachtTekst(null);
            } else if (!m.prioriteit) {
                bericht(INTAKE.impact.vraag, 'bot');
                opties(INTAKE.impact.opties, o => { m.prioriteit = o.prioriteit; volgende(); });
                verwachtTekst(null);
            } else if (m.omschrijving === null) {
                if (m.categorie === 'overig') {
                    bericht('Wat is er aan de hand? Beschrijf het in één zin.', 'bot');
                } else {
                    bericht('Wil je in één zin zeggen wat er gebeurt? Bijvoorbeeld welke printer of welke foutmelding.', 'bot');
                    opties([{ label: 'Overslaan' }], () => { m.omschrijving = ''; volgende(); });
                }
                verwachtTekst('omschrijving', 'Typ je toelichting');
            } else if (!m.naam) {
                const naam = bewaard();
                bericht('Op welke naam mag de melding?', 'bot');
                if (naam) {
                    opties([{ label: naam, hoofd: true }, { label: 'Andere naam' }], o => {
                        if (o.label === naam) { m.naam = naam; volgende(); }
                        else { bericht('Wat is je naam?', 'bot'); verwachtTekst('naam', 'Je naam'); }
                    });
                    verwachtTekst(null);
                } else {
                    verwachtTekst('naam', 'Je naam');
                }
            } else {
                const regels = [
                    'Dit stuur ik naar ICT:',
                    'Onderwerp: ' + CATEGORIE_LABEL[m.categorie],
                    'Prioriteit: ' + PRIORITEIT_LABEL[m.prioriteit],
                    ...m.antwoorden,
                ];
                if (m.omschrijving) regels.push('Toelichting: ' + m.omschrijving);
                regels.push('Naam: ' + m.naam);
                bericht(regels.join('\n'), 'bot');
                opties([{ label: 'Versturen', hoofd: true }, { label: 'Opnieuw beginnen' }], o => {
                    if (o.label === 'Versturen') versturen(); else start();
                });
                verwachtTekst(null);
            }
        }

        // Koppel vrije tekst aan een onderwerp via trefwoorden (begin van een woord).
        function herken(tekst) {
            const t = ' ' + tekst.toLowerCase() + ' ';
            let beste = null, score = 0;
            for (const [categorie, woorden] of Object.entries(INTAKE.trefwoorden)) {
                const treffers = woorden.filter(w => {
                    const i = t.indexOf(w);
                    return i > 0 && !/[a-z0-9à-ÿ]/.test(t[i - 1]);
                }).length;
                if (treffers > score) { beste = categorie; score = treffers; }
            }
            return beste;
        }

        document.getElementById('invoer').addEventListener('submit', e => {
            e.preventDefault();
            const tekst = tekstVeld.value.trim();
            if (!tekst || !wachtOp) return;
            tekstVeld.value = '';
            sluitOpties();
            bericht(tekst, 'gebruiker');

            if (wachtOp === 'onderwerp') {
                melding.categorie = herken(tekst) || 'overig';
                melding.omschrijving = tekst;
                if (melding.categorie !== 'overig') {
                    bericht('Duidelijk, het gaat over: ' + CATEGORIE_LABEL[melding.categorie].toLowerCase() + '.', 'bot');
                }
            } else if (wachtOp === 'omschrijving') {
                melding.omschrijving = tekst;
            } else if (wachtOp === 'naam') {
                melding.naam = tekst.slice(0, 100);
                bewaar(melding.naam);
            }
            volgende();
        });

        async function versturen() {
            const m = melding;
            const korteAntwoorden = m.antwoorden.map(a => a.slice(a.lastIndexOf('? ') + 2)).join(', ');
            const data = {
                medewerker: m.naam,
                categorie: m.categorie,
                prioriteit: m.prioriteit,
                probleem_beschrijving: m.omschrijving || CATEGORIE_LABEL[m.categorie] + (korteAntwoorden ? ': ' + korteAntwoorden : ''),
                doorlopen_stappen: m.antwoorden.join('\n'),
            };
            bericht('Even versturen…', 'bot');
            try {
                const res = await fetch('{% url "ticket_aanmaken" %}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
                    body: JSON.stringify(data),
                });
                const antwoord = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(Object.values(antwoord.fouten || {}).flat().join(' ') || 'foutcode ' + res.status);
                bericht(antwoord.doorgestuurd
                    ? 'Je melding ' + antwoord.nummer + ' is doorgestuurd naar de ICT-beheerder. Je hoort zo snel mogelijk van ze.'
                    : 'Je melding ' + antwoord.nummer + ' is opgeslagen. ICT bekijkt hem zo snel mogelijk.', 'bot');
                opties([{ label: 'Nieuwe melding' }], start);
            } catch (err) {
                bericht('Versturen lukte niet (' + err.message + ').', 'bot');
                opties([{ label: 'Opnieuw proberen', hoofd: true }], versturen);
            }
        }

        function start() {
            melding = nieuweMelding();
            volgende();
        }

        document.getElementById('opnieuw').addEventListener('click', () => {
            berichten.replaceChildren();
            start();
        });

        start();
    </script>

</body>
</html>
