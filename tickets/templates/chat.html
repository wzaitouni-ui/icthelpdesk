<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>ICT Helpdesk</title>
    <style>
        /* Gellix van handpickedagencies.com; de bestandsnamen veranderen soms bij een nieuwe build van die site. */
        @font-face { font-family: 'Gellix'; src: url('https://www.handpickedagencies.com/_next/static/media/Gellix_Regular-s.p.3blxyezxqnc4u.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        @font-face { font-family: 'Gellix'; src: url('https://www.handpickedagencies.com/_next/static/media/Gellix_SemiBold-s.p.0kvgscy2y_wb2.woff2') format('woff2'); font-weight: 600; font-display: swap; }
        @font-face { font-family: 'Gellix'; src: url('https://www.handpickedagencies.com/_next/static/media/Gellix_Bold-s.p.1d53qkh3e_jb7.woff2') format('woff2'); font-weight: 700; font-display: swap; }

        :root {
            --bg: #274548;
            --bg-card: #1e3a3e;
            --bg-card2: #243b3f;
            --bg-input: #1a3235;
            --accent: #adff00;
            --on-accent: #0d2023;
            --text: #ffffff;
            --muted: #7a9ea6;
            --label: #4a7a82;
            --border: rgba(255,255,255,0.12);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Gellix', system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 16px;
            line-height: 1.5;
            min-height: 100vh;
        }
        button, input { font: inherit; color: inherit; }

        /* Header */
        .topbar {
            position: sticky; top: 0; z-index: 10;
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            padding: 16px 24px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .merk { display: flex; align-items: center; gap: 14px; color: #ffffff; }
        .merk svg { height: 22px; width: auto; display: block; }
        .merk span { color: var(--muted); font-weight: 600; padding-left: 14px; border-left: 1px solid var(--border); }

        /* Knoppen */
        .knop { border-radius: 100px; padding: 12px 22px; cursor: pointer; font-weight: 700; border: 0; white-space: nowrap; }
        .knop-cta { background: var(--accent); color: var(--on-accent); }
        .knop-cta:hover { filter: brightness(1.06); }
        .knop-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--text); font-weight: 600; }
        .knop-ghost:hover { border-color: var(--accent); }
        .knop:disabled { opacity: .5; cursor: default; }
        .knop:focus-visible, .optie:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Indeling */
        .indeling {
            width: 100%; max-width: 1180px; margin: 0 auto;
            padding: 24px;
            display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px;
        }

        /* Chat */
        .chat {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
            display: flex; flex-direction: column;
            height: calc(100vh - 120px); min-height: 480px;
        }
        .chat-kop { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .chat-kop h1 { font-size: 18px; font-weight: 600; margin: 0; }
        .status-stip { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
        .chat-kop small { color: var(--muted); margin-left: auto; }

        .berichten { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
        .bericht { max-width: 82%; padding: 12px 16px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .bericht.bot { background: var(--bg-card2); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 6px; }
        .bericht.gebruiker { background: var(--accent); color: var(--on-accent); align-self: flex-end; border-bottom-right-radius: 6px; font-weight: 600; }

        .opties { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 100%; }
        .optie {
            background: transparent; border: 1.5px solid var(--border); color: var(--text);
            border-radius: 100px; padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 15px;
        }
        .optie:hover:not(:disabled) { border-color: var(--accent); }
        .optie.hoofd { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
        .optie.gekozen { border-color: var(--accent); }
        .optie:disabled { cursor: default; opacity: .45; }
        .optie.gekozen:disabled { opacity: 1; }

        .invoer { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--border); }
        .invoer input {
            flex: 1; min-width: 0; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 100px; padding: 12px 18px; outline: none;
        }
        .invoer input::placeholder { color: var(--label); }
        .invoer input:focus { border-color: var(--accent); }
        .invoer input:disabled { opacity: .6; }

        /* Zijkolom */
        .kaart { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; align-self: start; }
        .kaart h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
        .stappen { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; color: var(--muted); font-size: 15px; counter-reset: stap; }
        .stappen li { display: flex; gap: 10px; }
        .stappen li::before {
            counter-increment: stap; content: counter(stap);
            flex: none; width: 24px; height: 24px; border-radius: 50%;
            background: var(--bg-card2); border: 1px solid var(--border); color: var(--text);
            font-size: 13px; font-weight: 600; display: grid; place-items: center;
        }

        @media (max-width: 900px) {
            .indeling { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 16px; }
            .chat { height: calc(100dvh - 104px); }
            .topbar { padding: 12px 16px; }
            .topbar .knop { padding: 10px 16px; font-size: 14px; }
            .merk span { display: none; }
        }
        @media (max-width: 520px) {
            .bericht { max-width: 92%; }
            .chat-kop small { display: none; }
        }
    </style>
</head>

        <button class="knop knop-ghost" type="button" id="opnieuw">Nieuwe melding</button>
    </header>

    <main class="indeling">
        <section class="chat" aria-label="Helpdesk-chat">
            <div class="chat-kop">
                <span class="status-stip" aria-hidden="true"></span>
                <h1>ICT-melding</h1>
                <small>Gaat direct naar de ICT-beheerder</small>
            </div>
            <div class="berichten" id="berichten" role="log" aria-live="polite"></div>
            <form class="invoer" id="invoer" autocomplete="off">
                <input type="text" id="tekst" maxlength="500" aria-label="Je antwoord">
                <button class="knop knop-cta" type="submit" id="verstuur">Verstuur</button>
            </form>
        </section>

        <aside class="kaart">
            <h2>Zo werkt het</h2>
            <ol class="stappen">
                <li>Kies waar je probleem over gaat.</li>
                <li>Beantwoord een paar korte vragen.</li>
                <li>Je melding gaat meteen naar de ICT-beheerder, die contact met je opneemt.</li>
            </ol>
        </aside>
    </main>

    {{ intake|json_script:"intake" }}
    <script>
        // Alle state bovenaan, zodat niets wordt gebruikt voordat het bestaat.
        const INTAKE = JSON.parse(document.getElementById('intake').textContent);
        const CATEGORIE_LABEL = Object.fromEntries(INTAKE.categorieen);
        const PRIORITEIT_LABEL = { kritiek: 'Kritiek', hoog: 'Hoog', normaal: 'Normaal', laag: 'Laag' };
        const CSRF = document.querySelector('meta[name="csrf-token"]').content;
        const berichten = document.getElementById('berichten');
        const tekstVeld = document.getElementById('tekst');
        const verstuurKnop = document.getElementById('verstuur');
        let melding;          // wat we tot nu toe weten
        let wachtOp = null;   // welke getypte invoer we verwachten: 'onderwerp', 'omschrijving' of 'naam'
        let openOpties = null;

        function nieuweMelding() {
            return { categorie: null, vraagIndex: 0, antwoorden: [], prioriteit: null, omschrijving: null, naam: null };
        }

        function bericht(tekst, wie) {
            const el = document.createElement('div');
            el.className = 'bericht ' + wie;
            el.textContent = tekst;
            berichten.appendChild(el);
            berichten.scrollTop = berichten.scrollHeight;
        }

        function opties(lijst, bijKeuze) {
            const groep = document.createElement('div');
            groep.className = 'opties';
            lijst.forEach(optie => {
                const knop = document.createElement('button');
                knop.type = 'button';
                knop.className = 'optie' + (optie.hoofd ? ' hoofd' : '');
                knop.textContent = optie.label;
                knop.addEventListener('click', () => {
                    sluitOpties();
                    knop.classList.add('gekozen');
                    bericht(optie.label, 'gebruiker');
                    bijKeuze(optie);
                });
                groep.appendChild(knop);
            });
            berichten.appendChild(groep);
            berichten.scrollTop = berichten.scrollHeight;
            openOpties = groep;
        }

        function sluitOpties() {
            if (openOpties) openOpties.querySelectorAll('button').forEach(b => b.disabled = true);
            openOpties = null;
        }

        function verwachtTekst(soort, placeholder) {
            wachtOp = soort;
            tekstVeld.disabled = verstuurKnop.disabled = !soort;
            tekstVeld.placeholder = placeholder || 'Kies hierboven een antwoord';
            if (soort) tekstVeld.focus({ preventScroll: true });
        }

        function bewaard() { try { return localStorage.getItem('hd-naam') || ''; } catch (e) { return ''; } }
        function bewaar(naam) { try { localStorage.setItem('hd-naam', naam); } catch (e) {} }

        // Bepaalt steeds de volgende vraag op basis van wat we al weten.
        function volgende() {
            const m = melding;
            const vragen = INTAKE.vragen[m.categorie] || [];

            if (!m.categorie) {
                bericht('Hoi! Ik zet je melding direct door naar de ICT-beheerder. Waar gaat het over? Kies een onderwerp of typ het kort.', 'bot');
                opties(INTAKE.categorieen.map(([code, label]) => ({ label, code })), o => { m.categorie = o.code; volgende(); });
                verwachtTekst('onderwerp', "Of typ het kort, bijv. 'printer doet niks'");
            } else if (m.vraagIndex < vragen.length) {
                const v = vragen[m.vraagIndex];
                bericht(v.vraag, 'bot');
                opties(v.opties, o => {
                    m.antwoorden.push(v.vraag + ' ' + o.label);
                    if (o.prioriteit) m.prioriteit = o.prioriteit;
                    m.vraagIndex++;
                    volgende();
                });
                verwachtTekst(null);
            } else if (!m.prioriteit) {
                bericht(INTAKE.impact.vraag, 'bot');
                opties(INTAKE.impact.opties, o => { m.prioriteit = o.prioriteit; volgende(); });
                verwachtTekst(null);
            } else if (m.omschrijving === null) {
                if (m.categorie === 'overig') {
                    bericht('Wat is er aan de hand? Beschrijf het in één zin.', 'bot');
                } else {
                    bericht('Wil je in één zin zeggen wat er gebeurt? Bijvoorbeeld welke printer of welke foutmelding.', 'bot');
                    opties([{ label: 'Overslaan' }], () => { m.omschrijving = ''; volgende(); });
                }
                verwachtTekst('omschrijving', 'Typ je toelichting');
            } else if (!m.naam) {
                const naam = bewaard();
                bericht('Op welke naam mag de melding?', 'bot');
                if (naam) {
                    opties([{ label: naam, hoofd: true }, { label: 'Andere naam' }], o => {
                        if (o.label === naam) { m.naam = naam; volgende(); }
                        else { bericht('Wat is je naam?', 'bot'); verwachtTekst('naam', 'Je naam'); }
                    });
                    verwachtTekst(null);
                } else {
                    verwachtTekst('naam', 'Je naam');
                }
            } else {
                const regels = [
                    'Dit stuur ik naar ICT:',
                    'Onderwerp: ' + CATEGORIE_LABEL[m.categorie],
                    'Prioriteit: ' + PRIORITEIT_LABEL[m.prioriteit],
                    ...m.antwoorden,
                ];
                if (m.omschrijving) regels.push('Toelichting: ' + m.omschrijving);
                regels.push('Naam: ' + m.naam);
                bericht(regels.join('\n'), 'bot');
                opties([{ label: 'Versturen', hoofd: true }, { label: 'Opnieuw beginnen' }], o => {
                    if (o.label === 'Versturen') versturen(); else start();
                });
                verwachtTekst(null);
            }
        }

        // Koppel vrije tekst aan een onderwerp via trefwoorden (begin van een woord).
        function herken(tekst) {
            const t = ' ' + tekst.toLowerCase() + ' ';
            let beste = null, score = 0;
            for (const [categorie, woorden] of Object.entries(INTAKE.trefwoorden)) {
                const treffers = woorden.filter(w => {
                    const i = t.indexOf(w);
                    return i > 0 && !/[a-z0-9à-ÿ]/.test(t[i - 1]);
                }).length;
                if (treffers > score) { beste = categorie; score = treffers; }
            }
            return beste;
        }

        document.getElementById('invoer').addEventListener('submit', e => {
            e.preventDefault();
            const tekst = tekstVeld.value.trim();
            if (!tekst || !wachtOp) return;
            tekstVeld.value = '';
            sluitOpties();
            bericht(tekst, 'gebruiker');

            if (wachtOp === 'onderwerp') {
                melding.categorie = herken(tekst) || 'overig';
                melding.omschrijving = tekst;
                if (melding.categorie !== 'overig') {
                    bericht('Duidelijk, het gaat over: ' + CATEGORIE_LABEL[melding.categorie].toLowerCase() + '.', 'bot');
                }
            } else if (wachtOp === 'omschrijving') {
                melding.omschrijving = tekst;
            } else if (wachtOp === 'naam') {
                melding.naam = tekst.slice(0, 100);
                bewaar(melding.naam);
            }
            volgende();
        });

        async function versturen() {
            const m = melding;
            const korteAntwoorden = m.antwoorden.map(a => a.slice(a.lastIndexOf('? ') + 2)).join(', ');
            const data = {
                medewerker: m.naam,
                categorie: m.categorie,
                prioriteit: m.prioriteit,
                probleem_beschrijving: m.omschrijving || CATEGORIE_LABEL[m.categorie] + (korteAntwoorden ? ': ' + korteAntwoorden : ''),
                doorlopen_stappen: m.antwoorden.join('\n'),
            };
            bericht('Even versturen…', 'bot');
            try {
                const res = await fetch('{% url "ticket_aanmaken" %}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
                    body: JSON.stringify(data),
                });
                const antwoord = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(Object.values(antwoord.fouten || {}).flat().join(' ') || 'foutcode ' + res.status);
                bericht(antwoord.doorgestuurd
                    ? 'Je melding ' + antwoord.nummer + ' is doorgestuurd naar de ICT-beheerder. Je hoort zo snel mogelijk van ze.'
                    : 'Je melding ' + antwoord.nummer + ' is opgeslagen. ICT bekijkt hem zo snel mogelijk.', 'bot');
                opties([{ label: 'Nieuwe melding' }], start);
            } catch (err) {
                bericht('Versturen lukte niet (' + err.message + ').', 'bot');
                opties([{ label: 'Opnieuw proberen', hoofd: true }], versturen);
            }
        }

        function start() {
            melding = nieuweMelding();
            volgende();
        }

        document.getElementById('opnieuw').addEventListener('click', () => {
            berichten.replaceChildren();
            start();
        });

        start();
    </script>
</body>
</html>
